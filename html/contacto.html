<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Contacto | Oura & Co</title>
    <link rel="stylesheet" href="../css/contacto.css">
    <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@700&family=Poppins:wght@300;400&display=swap" rel="stylesheet">
</head>
<body>

    <nav class="navegacion">
        <div class="logo"><a href="index.html" class="logo_link">OURA & CO</a></div>
        <div class="enlaces">
            <a href="inicio.html">Inicio</a>
            <a href="contacto.html">Contacto</a>
        </div>
    </nav>

    <main class="contenedor-contacto">
        <section class="encabezado-contacto">
            <h1>HABLEMOS DE TU PROYECTO</h1>
            <p>Estamos listos para transformar tu espacio en algo único.</p>
        </section>

        <section class="contenido-formulario">
            <form class="formulario">
                <div class="grupo">
                    <label>Nombre completo</label>
                    <input type="text" placeholder="Tu nombre">
                </div>
                <div class="grupo">
                    <label>Correo electrónico</label>
                    <input type="email" placeholder="email@ejemplo.com">
                </div>
                <div class="grupo">
                    <label>Mensaje</label>
                    <textarea rows="5" placeholder="Cuéntanos tu idea..."></textarea>
                </div>
                <button type="submit" class="boton-enviar">ENVIAR MENSAJE</button>
            </form>

            <div class="datos-directos">
                <div class="bloque">
                    <h3>UBICACIÓN</h3>
                    <p>Lima, Perú</p>
                </div>
                <div class="bloque">
                    <h3>TELÉFONO</h3>
                    <p>+51 900 000 000</p>
                </div>
                <div class="bloque">
                    <h3>EMAIL</h3>
                    <p>contacto@oura.com</p>
                </div>
            </div>
        </section>
    </main>

    <!-- CORRECCIÓN: Se agregó el footer para consistencia (Checklist 5.2) -->
    <footer class="pie-pagina">
        <div class="contenido-footer">
            <h3>OURA & CO.</h3>
            <ul>
                <li><a href="#">Instagram</a></li>
                <li><a href="#">Pinterest</a></li>
                <li><a href="#">LinkedIn</a></li>
            </ul>
        </div>
        <p>&copy; 2026 Oura & Co. Todos los derechos reservados.</p>
    </footer>

    
    <script src="js/app.js"></script>

</body>
</html>
